# Packages the Gemini extension as spicrawl-gemini-<version>.zip and attaches
# it to a GitHub release.
#
# Trigger: push a gemini-v* tag. The tag must match the version in
# gemini-extension.json.
#
# The zip contains gemini-extension.json, GEMINI.md, LICENSE, and README.md
# from the repository root.

name: release-gemini

on:
  push:
    tags: ['gemini-v*']

permissions:
  contents: read

concurrency:
  group: release-gemini-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: tag matches the manifest
        run: |
          version="$(jq -r '.version' gemini-extension.json)"
          if [ "$GITHUB_REF_NAME" != "gemini-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match gemini-extension.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: package
        run: |
          zip -r "$RUNNER_TEMP/spicrawl-gemini-$VERSION.zip" gemini-extension.json GEMINI.md LICENSE README.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/spicrawl-gemini-$VERSION.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Spicrawl extension for Gemini $VERSION."
