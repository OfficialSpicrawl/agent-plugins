# Packages the OpenAI plugin (plugins/spicrawl-openai/) as
# spicrawl-openai-<version>.zip and attaches it to a GitHub release.
#
# Trigger: push an openai-v* tag. The tag must match the version in
# plugins/spicrawl-openai/plugin.json.
#
# The OPENAI_APP_ID repository secret is injected into
# plugins/spicrawl-openai/.app.json before packaging.

name: release-openai

on:
  push:
    tags: ['openai-v*']

permissions:
  contents: read

concurrency:
  group: release-openai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: tag matches the manifest
        run: |
          version="$(jq -r '.version' plugins/spicrawl-openai/plugin.json)"
          if [ "$GITHUB_REF_NAME" != "openai-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugins/spicrawl-openai/plugin.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: inject OPENAI_APP_ID
        env:
          OPENAI_APP_ID: ${{ secrets.OPENAI_APP_ID }}
        run: |
          if [ -z "$OPENAI_APP_ID" ]; then
            echo "::error::the OPENAI_APP_ID repository secret is not set"
            exit 1
          fi
          jq '.apps.spicrawl.id = env.OPENAI_APP_ID' plugins/spicrawl-openai/.app.json > "$RUNNER_TEMP/.app.json"
          mv "$RUNNER_TEMP/.app.json" plugins/spicrawl-openai/.app.json

      - name: package
        run: |
          cd plugins/spicrawl-openai
          zip -r "$RUNNER_TEMP/spicrawl-openai-$VERSION.zip" .

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/spicrawl-openai-$VERSION.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Spicrawl plugin for OpenAI $VERSION."
