# Repo-wide checks: every JSON file parses, the OpenCode plugin's tests pass,
# no file contains a real-looking Spicrawl API key, no file names an internal
# engine, and the Dify plugin passes its pytest. The n8n node lives in
# OfficialSpicrawl/n8n-nodes-spicrawl and has its own CI.

name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON files parse
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          exit $status
      - name: opencode tests
        working-directory: opencode
        run: node --test
      - name: no real-looking API keys
        run: |
          if git grep -nIE 'spicrawl_(live|test)_[a-z0-9]{20,}' -- . ; then
            echo "::error::a file contains something that looks like a real Spicrawl API key"
            exit 1
          fi
      # Customers see three rendering tiers: fetch, js and browser. The engines
      # behind them are internal and must not appear in any published text.
      # Lockfiles are exempt (dependency names) and so is this file (it holds
      # the list). "moli" matches as a whole word only.
      - name: no internal engine names
        run: |
          words='(^|[^a-z])moli([^a-z]|$)|chromium|chrome|camoufox|obscura|browserless|headful|headless|playwright|puppeteer'
          if git grep -nIiE "$words" -- . ':!*package-lock.json' ':!*pnpm-lock.yaml' ':!*.lock' ':!.github/workflows/validate.yml'; then
            echo "::error::a tracked file names an internal engine; say fetch, js (JavaScript rendering) or browser (a full browser) instead"
            exit 1
          fi

  dify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dify/requirements.txt
      - name: install
        run: pip install -r requirements.txt pytest
      - name: pytest
        run: python -m pytest
