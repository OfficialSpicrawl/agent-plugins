# Packages the Devin plugin (plugins/spicrawl/) as
# spicrawl-devin-<version>.zip and attaches it to a GitHub release.
#
# Trigger: push a devin-v* tag. No manifest version check is performed because
# the Devin manifest does not include a version field.
#
# The zip contains the full contents of plugins/spicrawl/ so that, after
# unzip, the manifest is available at .devin-plugin/plugin.json.

name: release-devin

on:
  push:
    tags: ['devin-v*']

permissions:
  contents: read

concurrency:
  group: release-devin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: derive version from tag
        run: |
          version="${GITHUB_REF_NAME#devin-v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: package
        run: |
          cd plugins/spicrawl
          zip -r "$RUNNER_TEMP/spicrawl-devin-$VERSION.zip" .

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/spicrawl-devin-$VERSION.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Spicrawl plugin for Devin $VERSION."
