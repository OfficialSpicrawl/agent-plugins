# Publishes the OpenCode plugin (opencode/) to npm as opencode-spicrawl.
#
# Auth is the NPM_TOKEN repository secret: an npm granular access token for
# the spicrawl account with publish rights on the package and "Bypass
# two-factor authentication". Write tokens expire (90 days at most), so rotate
# the secret before then. npm ends direct token publishing in January 2027;
# switch to trusted publishing (OIDC) before then.
#
# Each publish is followed by an opencode-spicrawl-vX.Y.Z tag on the published
# commit and a GitHub release whose notes are that version's section of
# opencode/CHANGELOG.md. The tag carries the package name because this repo
# holds several things.
#
# The repo is public, so each release carries a provenance attestation. The
# attestation needs opencode/package.json "repository" to match this GitHub
# repo (Spicrawl/agent-plugins, directory "opencode").
#
# Release: bump "version" in opencode/package.json, add a "## X.Y.Z (date)"
# section to opencode/CHANGELOG.md, then merge to main. The CI publishes that
# version if npm does not have it yet, and otherwise only runs the checks. A
# prerelease version (e.g. 0.2.0-beta.1) is published under the `next`
# dist-tag so `npm install opencode-spicrawl` keeps getting latest.
#
# Triggers: `push` to main and `pull_request`, limited to changes under
# opencode/ and to this file, and `workflow_dispatch` (GitHub does not accept
# a paths filter there). Every step through "already on npm?" runs on all
# triggers. The publish step runs only when the version is new, the event is
# not a pull request, and the ref is main: a push to main, or a manual run on
# main (which retries a publish after, say, the secret was missing).

name: release-opencode

on:
  push:
    branches: [main]
    paths: ['opencode/**', '.github/workflows/release-opencode.yml']
  pull_request:
    paths: ['opencode/**', '.github/workflows/release-opencode.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-opencode-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: opencode

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the tag and GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opencode/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: install
        run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run check
      - name: test
        run: npm test
      - name: already on npm?
        id: check
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: publish
        if: steps.check.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN repository secret is not set"
            exit 1
          fi
          npm publish --provenance --access public --tag "${{ steps.check.outputs.tag }}"
      - name: GitHub release
        if: steps.check.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="opencode-spicrawl-v$version"
          # This version's section of CHANGELOG.md: from its "## X.Y.Z" heading
          # to the next "## " heading.
          awk -v v="$version" 'index($0, "## " v " ") == 1 { f = 1; next } f && /^## / { exit } f' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Published opencode-spicrawl@$version to npm." > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
